semantic_models:
  - name: pull_requests
    description: >
      One row per pull request (fct_pull_requests). The only semantic model for the DORA
      metrics, so every figure is computed over individual PRs and means the same thing
      wherever it is quoted. Metrics count merged PRs by the day they were merged.
    model: ref('fct_pull_requests')
    defaults:
      agg_time_dimension: merged_at

    entities:
      - name: pull_request
        type: primary
        expr: pr_number

    dimensions:
      - name: merged_at
        type: time
        type_params:
          time_granularity: day
      - name: is_bot
        type: categorical
        description: True when the PR author is an automated account (login ends in "[bot]"). Filter on false for human-only figures.
      - name: is_merged
        type: categorical

    measures:
      - name: merged_pr_count
        description: Number of merged PRs. A merge is used as a proxy for a deployment.
        agg: sum
        expr: case when is_merged then 1 else 0 end

      - name: lead_time_median_hours
        description: Median hours from PR opened to merged. The headline lead time, because PR lead times are heavily skewed by a few very slow PRs.
        agg: median
        expr: lead_time_hours

      - name: lead_time_p90_hours
        description: 90th percentile of hours from PR opened to merged (continuous, interpolated). 9 in 10 merged PRs were merged faster than this.
        agg: percentile
        expr: lead_time_hours
        agg_params:
          percentile: 0.9
          use_discrete_percentile: false
          use_approximate_percentile: false

      - name: lead_time_mean_hours
        description: Mean hours from PR opened to merged, with every PR counted once (PR-weighted). Pulled up by a few very slow PRs, so quote it next to the median.
        agg: average
        expr: lead_time_hours

metrics:
  - name: deployment_frequency
    description: Number of pull requests merged (a merge is used as a proxy for a deployment). Sum it over any period, or group by metric_time.
    label: Deployment Frequency
    type: simple
    type_params:
      measure: merged_pr_count
    filter: |
      {{ Dimension('pull_request__is_merged') }} = true

  - name: lead_time_median_hours
    description: Median hours from PR opened to merged, over merged PRs. The headline Lead Time for Changes figure.
    label: Lead Time for Changes, median (hrs)
    type: simple
    type_params:
      measure: lead_time_median_hours
    filter: |
      {{ Dimension('pull_request__is_merged') }} = true

  - name: lead_time_p90_hours
    description: 90th percentile hours from PR opened to merged, over merged PRs.
    label: Lead Time for Changes, p90 (hrs)
    type: simple
    type_params:
      measure: lead_time_p90_hours
    filter: |
      {{ Dimension('pull_request__is_merged') }} = true

  - name: lead_time_mean_hours
    description: PR-weighted mean hours from PR opened to merged, over merged PRs.
    label: Lead Time for Changes, mean (hrs)
    type: simple
    type_params:
      measure: lead_time_mean_hours
    filter: |
      {{ Dimension('pull_request__is_merged') }} = true
