version: 2

sources:
  - name: github
    schema: raw
    description: Raw tables written by fetch_prs.py. Every row carries _loaded_at, the UTC time of the fetch that wrote it.
    config:
      # Source freshness: how old is the newest fetch? Checked by `dbt source freshness` in the daily refresh workflow
      # (not by `dbt build`). A daily fetch is normally under 24 hours old; 36 hours means one run was missed (warn),
      # 72 hours means the data is three days stale and the dashboard is showing old numbers (error, the run fails).
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: github_pull_requests
      - name: github_pr_reviews
