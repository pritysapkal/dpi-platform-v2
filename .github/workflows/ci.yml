name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run on the same branch/PR cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository, so the token it gets is read-only.
permissions:
  contents: read

# What this workflow does, in one paragraph: it never touches GitHub's API or any secret. It builds the warehouse
# twice from files in the repository, with the same dbt project that runs in production:
#   1. from the 50-PR test fixture (fixtures/), then runs every test except the README-finding tests;
#   2. from the frozen copy of the real 2026-11-01 pull (fixtures/frozen/), then runs only the README-finding tests.
# Both pytest runs set DPIP_FAIL_ON_SKIP=1, so a skipped test is a failed test: a green run means every selected test
# really ran. Which tests each run selects is written once, in workflow_selections.py. The daily live-data run is a
# different workflow.
jobs:
  fixture-backed-tests:
    name: Build on fixture data, run the tests
    runs-on: ubuntu-latest

    env:
      # dbt, mf and the tests all read the database file named here, and the dbt profile lives in the repository.
      DBT_PROFILES_DIR: profiles
      DPIP_FAIL_ON_SKIP: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            agent/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r agent/requirements.txt -r dashboard/requirements.txt

      # ---- 1. the 50-PR fixture: code logic, with answers worked out by hand ----

      - name: Load the fixture into fixture.duckdb
        env:
          DPIP_DB_PATH: fixture.duckdb
        run: python fixtures/load_fixture.py fixture.duckdb fixture

      # `dbt build` runs every model, data test and unit test in dependency order: the real pass/fail gate.
      - name: dbt build on the fixture
        env:
          DPIP_DB_PATH: fixture.duckdb
        run: dbt build

      # Checks the MetricFlow definitions against the tables `dbt build` just created.
      - name: Validate the semantic layer (mf validate-configs)
        env:
          DPIP_DB_PATH: fixture.duckdb
        run: mf validate-configs

      - name: pytest on the fixture (everything except the README findings)
        env:
          DPIP_DB_PATH: fixture.duckdb
        run: python -m pytest ingestion_tests agent/tests dashboard/tests -q -rs -m "$(python workflow_selections.py push-fixture)"

      # ---- 2. the frozen real pull: the README's key findings ----

      - name: Load the frozen real data into frozen.duckdb
        env:
          DPIP_DB_PATH: frozen.duckdb
        run: python fixtures/load_fixture.py frozen.duckdb frozen

      - name: dbt build on the frozen data
        env:
          DPIP_DB_PATH: frozen.duckdb
        run: dbt build

      - name: pytest on the frozen data (README key findings)
        env:
          DPIP_DB_PATH: frozen.duckdb
        run: python -m pytest ingestion_tests agent/tests dashboard/tests -q -rs -m "$(python workflow_selections.py push-frozen)"
