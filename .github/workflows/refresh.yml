name: Daily data refresh

# Once a day, pull the live data from GitHub, rebuild the warehouse and check it. Only if every check passes, the tables
# the dashboard reads are exported to Parquet and force-pushed to the `data` branch, where the public dashboard downloads
# them. If anything fails, the alert job opens (or updates) a GitHub issue labelled data-refresh-failure; the next
# successful run closes it. Nothing fails silently, and a failed run never publishes.
on:
  schedule:
    - cron: "47 2 * * *"  # 02:47 UTC daily; an off-peak minute, since GitHub delays schedules that start on the hour
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail on purpose before fetching anything (to test that an issue opens)"
        type: boolean
        default: false

# Two refreshes never run at once; a second one waits instead of cancelling the first.
concurrency:
  group: data-refresh
  cancel-in-progress: false

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  refresh:
    name: Fetch, build and check the live data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DBT_PROFILES_DIR: profiles
      DPIP_DB_PATH: dev.duckdb
      DPIP_FAIL_ON_SKIP: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            agent/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r agent/requirements.txt -r dashboard/requirements.txt

      - name: Simulated failure (only when asked for)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "simulate_failure was set: failing on purpose so the alert can be tested."
          exit 1

      - name: Fetch the live data from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python fetch_prs.py

      - name: dbt build (models, data tests, unit tests)
        run: dbt build

      # How old is the newest fetch? Warns after 36 hours, fails after 72 (models/staging/github/sources.yml).
      - name: dbt source freshness
        run: dbt source freshness

      - name: Validate the semantic layer (mf validate-configs)
        run: mf validate-configs

      # Only tests that hold on any data: today's numbers are different from yesterday's, so pinned figures belong to the
      # fixture and the frozen copy, which every push already checks.
      - name: pytest, live-safe tests only (zero skips)
        run: python -m pytest ingestion_tests agent/tests dashboard/tests -q -rs -m "$(python workflow_selections.py scheduled-live)"

      # Reached only when every step above passed. The export reads its own files back and compares them with the
      # database before it finishes, so a bad snapshot fails here.
      - name: Export the dashboard snapshot (Parquet + manifest.json)
        run: python ops/export_snapshot.py dev.duckdb snapshot

      - name: Hand the snapshot to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 7

  # A separate job, so the one job that can write to the repository never sees the GitHub API token and runs nothing
  # but git. Runs only when the refresh job succeeded (the default for `needs`).
  publish:
    name: Publish the snapshot to the data branch
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # to push the data branch

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch the snapshot from the refresh job
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot

      # One commit with no history (an orphan branch), force-pushed: the data branch always holds exactly the newest
      # snapshot and never grows. A push made with the workflow's own token starts no other workflow.
      - name: Force-push the snapshot as a single commit to the data branch
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          test -f "$SNAPSHOT_DIR/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan data-snapshot
          git rm -r --quiet --cached .
          git clean -fdxq
          cp "$SNAPSHOT_DIR"/* .
          git add -A
          as_of=$(python3 -c "import json; print(json.load(open('manifest.json'))['data_as_of'])")
          git commit --quiet -m "Data snapshot as of ${as_of}, built from ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/data
          echo "published commit $(git rev-parse --short HEAD) to the data branch, files:" && ls -l

  alert:
    name: Open or close the failure issue
    needs: [refresh, publish]
    # Runs after a failure of either job or a success of both, not after a cancellation. When the refresh fails, the
    # publish job is skipped, so "publish succeeded" means the whole run succeeded.
    if: ${{ always() && (needs.refresh.result == 'failure' || needs.publish.result == 'failure' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # to check out the alert script
      issues: write   # to open, comment on and close the issue
      actions: read   # to look up which step failed

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Open or update the issue (refresh or publish failed)
        if: ${{ needs.refresh.result == 'failure' || needs.publish.result == 'failure' }}
        run: python3 ops/refresh_alert.py failure

      - name: Close the issue if one is open (refreshed and published)
        if: ${{ needs.publish.result == 'success' }}
        run: python3 ops/refresh_alert.py success
