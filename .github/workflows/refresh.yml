name: Daily data refresh

# Once a day, pull the live data from GitHub, rebuild the warehouse and check it. If anything fails, the alert job opens
# (or updates) a GitHub issue labelled data-refresh-failure; the next successful run closes it. Nothing fails silently.
on:
  schedule:
    - cron: "47 2 * * *"  # 02:47 UTC daily; an off-peak minute, since GitHub delays schedules that start on the hour
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail on purpose before fetching anything (to test that an issue opens)"
        type: boolean
        default: false

# Two refreshes never run at once; a second one waits instead of cancelling the first.
concurrency:
  group: data-refresh
  cancel-in-progress: false

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  refresh:
    name: Fetch, build and check the live data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DBT_PROFILES_DIR: profiles
      DPIP_DB_PATH: dev.duckdb
      DPIP_FAIL_ON_SKIP: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            agent/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r agent/requirements.txt -r dashboard/requirements.txt

      - name: Simulated failure (only when asked for)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "simulate_failure was set: failing on purpose so the alert can be tested."
          exit 1

      - name: Fetch the live data from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python fetch_prs.py

      - name: dbt build (models, data tests, unit tests)
        run: dbt build

      # How old is the newest fetch? Warns after 36 hours, fails after 72 (models/staging/github/sources.yml).
      - name: dbt source freshness
        run: dbt source freshness

      - name: Validate the semantic layer (mf validate-configs)
        run: mf validate-configs

      # Only tests that hold on any data: today's numbers are different from yesterday's, so pinned figures belong to the
      # fixture and the frozen copy, which every push already checks.
      - name: pytest, live-safe tests only (zero skips)
        run: python -m pytest ingestion_tests agent/tests dashboard/tests -q -rs -m "$(python workflow_selections.py scheduled-live)"

  alert:
    name: Open or close the failure issue
    needs: refresh
    # Runs after a success or a failure of the refresh, not after a cancellation.
    if: ${{ always() && (needs.refresh.result == 'failure' || needs.refresh.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # to check out the alert script
      issues: write   # to open, comment on and close the issue
      actions: read   # to look up which step failed

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Open or update the issue (refresh failed)
        if: ${{ needs.refresh.result == 'failure' }}
        run: python3 ops/refresh_alert.py failure

      - name: Close the issue if one is open (refresh succeeded)
        if: ${{ needs.refresh.result == 'success' }}
        run: python3 ops/refresh_alert.py success
