[pytest]
addopts = --strict-markers
markers =
    no_db: touches no database file at all (checked while the test runs)
    any_data: reads the database but asserts only things that hold on any data (runs on the fixture and on live data)
    fixture_numbers: asserts exact values of the 50-PR test fixture (needs the fixture database)
    frozen_data: asserts exact values of the frozen real pull of 2026-11-01 (needs the frozen database)
